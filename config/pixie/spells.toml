# House spells Pixie may call without inventing bash.
# bin is looked up on $HOME/bin then PATH. confirm=true asks before run.

[spells.V]
bin = "V"
confirm = true
note = "Vanguarda desk"

[spells.siren]
bin = "siren"
confirm = false

[spells.play]
bin = "siren"
args = ["play"]
confirm = false

[spells.magpie]
bin = "magpie"
confirm = false

[spells.summon]
