[package]
name = "pixie"
version = "0.3.14"
edition = "2021"
description = "faeOS local AI familiar — files, house spells, runes"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "pixie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
